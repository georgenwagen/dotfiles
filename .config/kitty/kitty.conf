# ============================
# FONT
# ============================
font_size 12.0

# Modifier button for font size
adjust_line_height 110%

# ============================
# CURSOR
# ============================
cursor_shape beam
cursor_blink_interval 0.5
cursor_stop_blinking_after 15.0

# ============================
# SCROLLBACK
# ============================
scrollback_lines 10000
scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER

# ============================
# MOUSE
# ============================
mouse_hide_wait 3.0
copy_on_select yes
strip_trailing_spaces smart

# ============================
# WINDOW
# ============================
remember_window_size yes
initial_window_width 1200
initial_window_height 800
window_padding_width 10
hide_window_decorations yes
confirm_os_window_close 0

# Opacity
background_opacity 0.85
dynamic_background_opacity yes

# ============================
# TAB BAR
# ============================
tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted

# ============================
# KEYBINDINGS
# ============================
# Tab
map ctrl+shift+t new_tab
map ctrl+shift+w close_tab
map ctrl+shift+right next_tab
map ctrl+shift+left previous_tab

# Font size
map ctrl+plus change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0 change_font_size all 0

# Change opacity
map ctrl+shift+a>m set_background_opacity +0.05
map ctrl+shift+a>l set_background_opacity -0.05

# ============================
# THEME
# ============================
include themes/mocha.conf

# ============================
# BELL
# ============================
enable_audio_bell no
visual_bell_duration 0.0


# BEGIN_KITTY_FONTS
font_family      family='JetBrainsMono Nerd Font' postscript_name=JetBrainsMonoNF-Regular
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
